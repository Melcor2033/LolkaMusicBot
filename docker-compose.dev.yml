services:
  bot:
    build: .
    container_name: dynamic_voice_bot_dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://bot_user:bot_password@db:5432/voicebot_db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

  db:
    image: postgres:15-alpine
    container_name: voicebot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot_user
      POSTGRES_PASSWORD: bot_password
      POSTGRES_DB: voicebot_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  xray:
    image: teddysun/xray:latest
    container_name: voicebot_xray_dev
    restart: unless-stopped
    profiles:
      - spotify
    ports:
      - "10808:10808"
    volumes:
      - ./xray:/etc/xray

volumes:
  postgres_data_dev:
